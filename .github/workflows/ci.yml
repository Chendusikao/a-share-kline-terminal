name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  A_SHARE_ALLOW_AKSHARE_NETWORK: "0"
  NO_PROXY: "127.0.0.1,localhost"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.lock

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: |
          python -m ruff format --check backend
          npm --prefix frontend run format:check

      - name: Lint and type-check backend
        working-directory: backend
        run: |
          python -m ruff check .
          python -m mypy

      - name: Type-check frontend
        run: npm --prefix frontend run typecheck

      - name: Run backend unit tests
        working-directory: backend
        run: python -m pytest

      - name: Run frontend unit tests
        run: npm --prefix frontend test

      - name: Build production frontend
        run: npm --prefix frontend run build

      - name: Run end-to-end tests
        run: npm --prefix frontend run test:e2e
