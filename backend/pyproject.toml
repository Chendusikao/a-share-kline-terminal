[project]
name = "a-share-kline-terminal-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
